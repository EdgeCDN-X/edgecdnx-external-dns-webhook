apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgecdnx-external-dns-webhook.fullname" . }}
  labels:
    {{- include "edgecdnx-external-dns-webhook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "edgecdnx-external-dns-webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edgecdnx-external-dns-webhook.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: EDGECDNX_API_URL
              value: {{ required "edgecdnx.apiURL is required" .Values.edgecdnx.apiURL | quote }}
            - name: EDGECDNX_PROJECT_ID
              value: {{ required "edgecdnx.projectID is required" .Values.edgecdnx.projectID | quote }}
            - name: EDGECDNX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "edgecdnx.apiKeySecretRef.name is required" .Values.edgecdnx.apiKeySecretRef.name | quote }}
                  key: {{ required "edgecdnx.apiKeySecretRef.key is required" .Values.edgecdnx.apiKeySecretRef.key | quote }}
          ports:
            - name: webhook
              containerPort: 8888
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
