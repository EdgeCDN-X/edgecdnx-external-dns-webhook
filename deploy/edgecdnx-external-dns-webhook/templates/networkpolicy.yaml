{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edgecdnx-external-dns-webhook.fullname" . }}
  labels:
    {{- include "edgecdnx-external-dns-webhook.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "edgecdnx-external-dns-webhook.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.externalDNS.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.externalDNS.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8888
{{- end }}
